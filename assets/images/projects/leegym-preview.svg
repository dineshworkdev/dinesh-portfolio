<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background styling -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171a"/>
      <stop offset="100%" stop-color="#212529"/>
    </linearGradient>
    <pattern id="gym-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2c3238" stroke-width="1" stroke-dasharray="2,2"/>
    </pattern>
    <!-- Gold accent gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F4C400"/>
      <stop offset="100%" stop-color="#E5A800"/>
    </linearGradient>
    <!-- Burnt orange accent -->
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D25D38"/>
      <stop offset="100%" stop-color="#B84825"/>
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="800" height="600" fill="url(#bg-grad)"/>
  <rect width="800" height="600" fill="url(#gym-grid)"/>

  <!-- Retro Frame Inner Border -->
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="#343a40" stroke-width="2"/>
  <rect x="35" y="35" width="730" height="530" fill="none" stroke="#F4C400" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Top Navigation Mockup Bar -->
  <rect x="50" y="55" width="700" height="50" rx="4" fill="#1b1f23" stroke="#2c3238" stroke-width="1"/>
  <circle cx="75" cy="80" r="14" fill="#F4C400"/>
  <text x="75" y="85" font-family="'Oswald', 'Bebas Neue', Impact, sans-serif" font-size="15" font-weight="bold" fill="#14171a" text-anchor="middle">LG</text>
  <text x="100" y="86" font-family="'Oswald', 'Bebas Neue', Impact, sans-serif" font-size="20" font-weight="bold" fill="#F4C400" letter-spacing="1.5">LEE GYM</text>
  <text x="450" y="84" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8d99ae">PLANS</text>
  <text x="520" y="84" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8d99ae">SERVICES</text>
  <text x="600" y="84" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8d99ae">MANAGEMENT</text>
  <rect x="670" y="68" width="65" height="24" rx="3" fill="#F4C400"/>
  <text x="702" y="84" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" fill="#14171a" text-anchor="middle">JOIN</text>

  <!-- Hero Content Area inside mockup -->
  <g transform="translate(60, 135)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="24" rx="2" fill="#2c3238" stroke="#F4C400" stroke-width="1"/>
    <text x="110" y="16" font-family="'Oswald', sans-serif" font-size="11" font-weight="600" fill="#F4C400" letter-spacing="1" text-anchor="middle">FITNESS &amp; GYM PLATFORM</text>

    <!-- Main Title -->
    <text x="0" y="70" font-family="'Bebas Neue', 'Oswald', Impact, sans-serif" font-size="54" font-weight="bold" fill="#F4EFE4" letter-spacing="2">BUILD A STRONGER YOU</text>
    
    <text x="0" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#9da8b6" width="400">
      Membership management &amp; plans platform showcasing gym facilities
    </text>
    <text x="0" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#9da8b6">
      and helping members seamlessly explore available fitness tiers.
    </text>

    <!-- 3 Plan Cards Mockup -->
    <g transform="translate(0, 160)">
      <!-- Plan 1 -->
      <rect x="0" y="0" width="210" height="180" rx="4" fill="#1b1f23" stroke="#2c3238" stroke-width="1.5"/>
      <rect x="15" y="15" width="80" height="18" rx="2" fill="#2c3238"/>
      <text x="55" y="28" font-family="'Oswald', sans-serif" font-size="9" fill="#F4C400" text-anchor="middle">MONTHLY PLAN</text>
      <text x="15" y="65" font-family="'Bebas Neue', sans-serif" font-size="32" font-weight="bold" fill="#F4EFE4">STANDARD</text>
      <line x1="15" y1="80" x2="195" y2="80" stroke="#2c3238" stroke-width="1"/>
      <circle cx="25" cy="100" r="4" fill="#F4C400"/>
      <text x="35" y="104" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#ced4da">Gym Access</text>
      <circle cx="25" cy="122" r="4" fill="#F4C400"/>
      <text x="35" y="126" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#ced4da">Locker Facility</text>
      <rect x="15" y="142" width="180" height="26" rx="2" fill="#2c3238"/>
      <text x="105" y="159" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" fill="#F4EFE4" text-anchor="middle">SELECT PLAN</text>

      <!-- Plan 2 (Featured) -->
      <rect x="235" y="-10" width="210" height="200" rx="4" fill="#22272c" stroke="#F4C400" stroke-width="2"/>
      <rect x="250" y="8" width="90" height="18" rx="2" fill="#F4C400"/>
      <text x="295" y="21" font-family="'Oswald', sans-serif" font-size="9" font-weight="bold" fill="#14171a" text-anchor="middle">MOST POPULAR</text>
      <text x="250" y="60" font-family="'Bebas Neue', sans-serif" font-size="32" font-weight="bold" fill="#F4EFE4">PRO ANNUAL</text>
      <line x1="250" y1="75" x2="430" y2="75" stroke="#343a40" stroke-width="1"/>
      <circle cx="260" cy="95" r="4" fill="#F4C400"/>
      <text x="270" y="99" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#ced4da">Full Gym &amp; Cardio</text>
      <circle cx="260" cy="117" r="4" fill="#F4C400"/>
      <text x="270" y="121" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#ced4da">Trainer Guidance</text>
      <circle cx="260" cy="139" r="4" fill="#F4C400"/>
      <text x="270" y="143" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#ced4da">Diet Consultation</text>
      <rect x="250" y="155" width="180" height="28" rx="2" fill="url(#gold-grad)"/>
      <text x="340" y="173" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#14171a" text-anchor="middle">JOIN NOW</text>

      <!-- Plan 3 -->
      <rect x="470" y="0" width="210" height="180" rx="4" fill="#1b1f23" stroke="#2c3238" stroke-width="1.5"/>
      <rect x="485" y="15" width="80" height="18" rx="2" fill="#2c3238"/>
      <text x="525" y="28" font-family="'Oswald', sans-serif" font-size="9" fill="#F4C400" text-anchor="middle">QUARTERLY</text>
      <text x="485" y="65" font-family="'Bebas Neue', sans-serif" font-size="32" font-weight="bold" fill="#F4EFE4">FLEXI PASS</text>
      <line x1="485" y1="80" x2="665" y2="80" stroke="#2c3238" stroke-width="1"/>
      <circle cx="495" cy="100" r="4" fill="#F4C400"/>
      <text x="505" y="104" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#ced4da">Cardio Access</text>
      <circle cx="495" cy="122" r="4" fill="#F4C400"/>
      <text x="505" y="126" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#ced4da">Weight Training</text>
      <rect x="485" y="142" width="180" height="26" rx="2" fill="#2c3238"/>
      <text x="575" y="159" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" fill="#F4EFE4" text-anchor="middle">SELECT PLAN</text>
    </g>
  </g>

  <!-- Bottom Ledger Footer -->
  <g transform="translate(60, 520)">
    <line x1="0" y1="0" x2="680" y2="0" stroke="#2c3238" stroke-width="1"/>
    <text x="0" y="22" font-family="'Oswald', sans-serif" font-size="11" fill="#F4C400" letter-spacing="1">LEEGYM.VERCEL.APP</text>
    <text x="680" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#6c757d" text-anchor="end">MEMBERSHIP MANAGEMENT &amp; PLANS</text>
  </g>
</svg>

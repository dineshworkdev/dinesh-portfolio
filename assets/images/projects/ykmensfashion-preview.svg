<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background styling: Warm luxury editorial cream & mocha -->
    <linearGradient id="yk-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#EFE8DD"/>
    </linearGradient>
    <pattern id="yk-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E2D9CB" stroke-width="1" stroke-dasharray="2,2"/>
    </pattern>
    <!-- Espresso text tone -->
    <linearGradient id="espresso-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D221D"/>
      <stop offset="100%" stop-color="#4A3A32"/>
    </linearGradient>
    <!-- Burnt orange accent -->
    <linearGradient id="terracotta-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D25D38"/>
      <stop offset="100%" stop-color="#B84825"/>
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="800" height="600" fill="url(#yk-bg-grad)"/>
  <rect width="800" height="600" fill="url(#yk-grid)"/>

  <!-- Retro Frame Inner Border -->
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="#D8CDBE" stroke-width="2"/>
  <rect x="35" y="35" width="730" height="530" fill="none" stroke="#D25D38" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Top Navigation Mockup Bar -->
  <rect x="50" y="55" width="700" height="50" rx="4" fill="#FFFFFF" stroke="#D8CDBE" stroke-width="1"/>
  <circle cx="75" cy="80" r="14" fill="#2D221D"/>
  <text x="75" y="85" font-family="'Cinzel', 'Oswald', serif" font-size="13" font-weight="bold" fill="#FAF7F2" text-anchor="middle">YK</text>
  <text x="100" y="86" font-family="'Cinzel', 'Oswald', serif" font-size="17" font-weight="bold" fill="#2D221D" letter-spacing="2">YK MEN'S FASHION</text>
  <text x="440" y="84" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#78665B">COLLECTIONS</text>
  <text x="535" y="84" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#78665B">T-SHIRTS</text>
  <rect x="620" y="68" width="115" height="24" rx="3" fill="#D25D38"/>
  <text x="677" y="84" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CASHFREE PAY</text>

  <!-- Hero Content Area inside mockup -->
  <g transform="translate(60, 135)">
    <!-- Badge -->
    <rect x="0" y="0" width="230" height="24" rx="2" fill="#E8DEC-D" stroke="#D25D38" stroke-width="1"/>
    <text x="115" y="16" font-family="'Oswald', sans-serif" font-size="11" font-weight="600" fill="#D25D38" letter-spacing="1" text-anchor="middle">CONTEMPORARY MEN'S APPAREL</text>

    <!-- Main Title -->
    <text x="0" y="68" font-family="'Cinzel', 'Newsreader', serif" font-size="46" font-weight="bold" fill="#2D221D" letter-spacing="1">CURATED MEN'S T-SHIRTS</text>
    
    <text x="0" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#6B594E">
      Men's T-shirt fashion e-commerce store with real-time product browsing,
    </text>
    <text x="0" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#6B594E">
      catalog filters, and seamless integrated Cashfree payment gateway.
    </text>

    <!-- 3 Product Cards Mockup -->
    <g transform="translate(0, 155)">
      <!-- Product 1 -->
      <rect x="0" y="0" width="210" height="190" rx="4" fill="#FFFFFF" stroke="#D8CDBE" stroke-width="1.5"/>
      <!-- T-shirt thumbnail frame -->
      <rect x="15" y="15" width="180" height="95" rx="3" fill="#EFE8DD"/>
      <!-- Stylized T-shirt illustration -->
      <path d="M 85 40 L 95 30 L 115 30 L 125 40 L 140 45 L 130 65 L 120 60 L 120 95 L 90 95 L 90 60 L 80 65 L 70 45 Z" fill="#2D221D" opacity="0.85"/>
      <text x="15" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#2D221D">Oversized Heavy Tee</text>
      <text x="15" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#D25D38">₹ 899</text>
      <rect x="15" y="158" width="180" height="22" rx="2" fill="#FAF7F2" stroke="#D8CDBE" stroke-width="1"/>
      <text x="105" y="173" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#4A3A32" text-anchor="middle">ADD TO CART</text>

      <!-- Product 2 (Featured) -->
      <rect x="235" y="-5" width="210" height="200" rx="4" fill="#FFFFFF" stroke="#D25D38" stroke-width="2"/>
      <rect x="250" y="10" width="180" height="95" rx="3" fill="#FAF2EC"/>
      <path d="M 320 35 L 330 25 L 350 25 L 360 35 L 375 40 L 365 60 L 355 55 L 355 90 L 325 90 L 325 55 L 315 60 L 305 40 Z" fill="#D25D38" opacity="0.9"/>
      <rect x="250" y="15" width="60" height="16" rx="2" fill="#D25D38"/>
      <text x="280" y="26" font-family="'Oswald', sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BESTSELLER</text>
      <text x="250" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#2D221D">Vintage Mineral Wash</text>
      <text x="250" y="148" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#D25D38">₹ 1,199</text>
      <rect x="250" y="158" width="180" height="26" rx="2" fill="#D25D38"/>
      <text x="340" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">INSTANT CHECKOUT</text>

      <!-- Product 3 -->
      <rect x="470" y="0" width="210" height="190" rx="4" fill="#FFFFFF" stroke="#D8CDBE" stroke-width="1.5"/>
      <rect x="485" y="15" width="180" height="95" rx="3" fill="#EFE8DD"/>
      <path d="M 555 40 L 565 30 L 585 30 L 595 40 L 610 45 L 600 65 L 590 60 L 590 95 L 560 95 L 560 60 L 550 65 L 540 45 Z" fill="#4A3A32" opacity="0.85"/>
      <text x="485" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#2D221D">Minimal Boxy Fit</text>
      <text x="485" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#D25D38">₹ 949</text>
      <rect x="485" y="158" width="180" height="22" rx="2" fill="#FAF7F2" stroke="#D8CDBE" stroke-width="1"/>
      <text x="575" y="173" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#4A3A32" text-anchor="middle">ADD TO CART</text>
    </g>
  </g>

  <!-- Bottom Ledger Footer -->
  <g transform="translate(60, 520)">
    <line x1="0" y1="0" x2="680" y2="0" stroke="#D8CDBE" stroke-width="1"/>
    <text x="0" y="22" font-family="'Cinzel', serif" font-size="11" fill="#D25D38" letter-spacing="1">WWW.YKMENSFASHION.IN</text>
    <text x="680" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#78665B" text-anchor="end">E-COMMERCE · INTEGRATED PAYMENT GATEWAY</text>
  </g>
</svg>
